<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720">
  <rect width="1120" height="720" fill="#08111f"/>
  <style>
    .title{font:700 28px sans-serif;fill:#f8fafc}.sub{font:15px sans-serif;fill:#94a3b8}
    .head{font:700 19px sans-serif;fill:#e2e8f0}.label{font:15px sans-serif;fill:#cbd5e1}
    .value{font:700 14px monospace;fill:#f8fafc}.note{font:14px sans-serif;fill:#fbbf24}
    .grid{stroke:#334155;stroke-width:1}.target{stroke:#fbbf24;stroke-width:2;stroke-dasharray:7 6}
  </style>
  <text x="50" y="48" class="title">DMC central 20 Hz readiness</text>
  <text x="50" y="75" class="sub">USB simulated falls: 78 videos · 18,680 frames · 640×360 @ 20 FPS · RTX 5080</text>

  <rect x="40" y="105" width="500" height="500" rx="12" fill="#0f1b2d"/>
  <text x="65" y="142" class="head">Observed Pose coverage</text>
  <text x="65" y="166" class="sub">Real detections only; copied/missing rows forbidden</text>
  <line x1="190" y1="205" x2="500" y2="205" class="grid"/>
  <text x="65" y="240" class="label">Overall</text><rect x="190" y="220" width="285" height="27" rx="4" fill="#38bdf8"/><text x="485" y="240" class="value">92.0%</text>
  <text x="65" y="290" class="label">c1_sim</text><rect x="190" y="270" width="287" height="27" rx="4" fill="#22c55e"/><text x="487" y="290" class="value">92.6%</text>
  <text x="65" y="340" class="label">c2_sim</text><rect x="190" y="320" width="278" height="27" rx="4" fill="#fb7185"/><text x="478" y="340" class="value">89.8%</text>
  <text x="65" y="390" class="label">c3_sim</text><rect x="190" y="370" width="290" height="27" rx="4" fill="#a78bfa"/><text x="490" y="390" class="value">93.6%</text>
  <text x="65" y="445" class="label">Mean visible joints</text><text x="260" y="445" class="value">15.28 / 17</text>
  <text x="65" y="480" class="label">No-primary frames</text><text x="260" y="480" class="value">1,493 / 18,680</text>
  <text x="65" y="515" class="label">Gap resets</text><text x="260" y="515" class="value">254</text>
  <text x="65" y="550" class="label">Track resets</text><text x="260" y="550" class="value">8</text>
  <text x="65" y="580" class="note">c2 is the weakest camera slice.</text>

  <rect x="565" y="105" width="515" height="500" rx="12" fill="#0f1b2d"/>
  <text x="590" y="142" class="head">YOLO11m Pose micro-batch throughput</text>
  <text x="590" y="166" class="sub">Decode excluded; preprocess + inference + postprocess included</text>
  <line x1="745" y1="205" x2="1040" y2="205" class="grid"/>
  <line x1="839" y1="195" x2="839" y2="430" class="target"/>
  <text x="805" y="455" class="note">120 FPS target</text>
  <text x="590" y="240" class="label">Batch 1</text><rect x="745" y="220" width="194" height="27" rx="4" fill="#38bdf8"/><text x="949" y="240" class="value">247.7 FPS</text>
  <text x="590" y="290" class="label">Batch 2</text><rect x="745" y="270" width="244" height="27" rx="4" fill="#22c55e"/><text x="999" y="290" class="value">312.1 FPS</text>
  <text x="590" y="340" class="label">Batch 3</text><rect x="745" y="320" width="254" height="27" rx="4" fill="#a78bfa"/><text x="1009" y="340" class="value">325.4 FPS</text>
  <text x="590" y="390" class="label">Batch 6</text><rect x="745" y="370" width="275" height="27" rx="4" fill="#fb7185"/><text x="930" y="420" class="value">351.9 FPS · p95 21.2 ms</text>
  <text x="590" y="500" class="label">Sequential extractor</text><text x="800" y="500" class="value">35.8 FPS</text>
  <text x="590" y="535" class="label">Batch-6 headroom</text><text x="800" y="535" class="value">2.93× vs 120 FPS</text>
  <text x="590" y="580" class="note">Actual 6-stream decode/scheduler soak is still required.</text>

  <text x="50" y="650" class="note">This is input-pipeline readiness, not fall precision/recall. Fall intervals and matched normal ADL are not yet available.</text>
  <text x="50" y="680" class="sub">Artifacts: usb_sim_falldown_pose_quality_20260824.json · central_pose_microbatch_benchmark_20260824.json</text>
</svg>
