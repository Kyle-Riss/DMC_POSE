<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Reviewed Hybrid TCN frozen test comparison</title>
  <desc id="desc">Baseline, scratch, and warm-start event recall and false events per hour. Hybrid models improve recall but sharply increase false events.</desc>
  <rect width="960" height="520" rx="18" fill="#0f172a"/>
  <text x="48" y="52" fill="#f8fafc" font-family="sans-serif" font-size="26" font-weight="700">Reviewed Hybrid TCN · Frozen GMDCSA Test</text>
  <text x="48" y="82" fill="#94a3b8" font-family="sans-serif" font-size="15">Observed-only 10 Hz · 30×109 · persistence 2 · live model unchanged</text>

  <text x="48" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="18" font-weight="700">End-to-end event recall</text>
  <text x="530" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="18" font-weight="700">False events / hour (lower is better)</text>

  <text x="48" y="176" fill="#e2e8f0" font-family="sans-serif" font-size="15">Baseline v2</text>
  <rect x="160" y="158" width="140" height="24" rx="5" fill="#38bdf8"/>
  <text x="310" y="176" fill="#f8fafc" font-family="sans-serif" font-size="15">46.67%</text>
  <text x="530" y="176" fill="#e2e8f0" font-family="sans-serif" font-size="15">Baseline v2</text>
  <rect x="642" y="158" width="100" height="24" rx="5" fill="#38bdf8"/>
  <text x="752" y="176" fill="#f8fafc" font-family="sans-serif" font-size="15">99.63</text>

  <text x="48" y="228" fill="#e2e8f0" font-family="sans-serif" font-size="15">Hybrid scratch</text>
  <rect x="160" y="210" width="180" height="24" rx="5" fill="#f59e0b"/>
  <text x="350" y="228" fill="#f8fafc" font-family="sans-serif" font-size="15">60.00%</text>
  <text x="530" y="228" fill="#e2e8f0" font-family="sans-serif" font-size="15">Hybrid scratch</text>
  <rect x="642" y="210" width="199" height="24" rx="5" fill="#f59e0b"/>
  <text x="851" y="228" fill="#f8fafc" font-family="sans-serif" font-size="15">199.26</text>

  <text x="48" y="280" fill="#e2e8f0" font-family="sans-serif" font-size="15">Hybrid warm</text>
  <rect x="160" y="262" width="180" height="24" rx="5" fill="#fb7185"/>
  <text x="350" y="280" fill="#f8fafc" font-family="sans-serif" font-size="15">60.00%</text>
  <text x="530" y="280" fill="#e2e8f0" font-family="sans-serif" font-size="15">Hybrid warm</text>
  <rect x="642" y="262" width="249" height="24" rx="5" fill="#fb7185"/>
  <text x="901" y="280" fill="#f8fafc" font-family="sans-serif" font-size="15">249.08</text>

  <rect x="48" y="332" width="864" height="116" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="74" y="371" fill="#fca5a5" font-family="sans-serif" font-size="22" font-weight="700">REJECT · KEEP CURRENT SHADOW BASELINE</text>
  <text x="74" y="403" fill="#e2e8f0" font-family="sans-serif" font-size="16">Recall improved by 13.33 points, but scratch false-event rate doubled.</text>
  <text x="74" y="429" fill="#94a3b8" font-family="sans-serif" font-size="15">Next bottleneck: longer positive context + broader same-room hard negatives, not another architecture change.</text>
  <text x="48" y="490" fill="#64748b" font-family="sans-serif" font-size="13">Diagnostic experiment only · FallVision participant identity unresolved · 2026-08-10</text>
</svg>
