<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
  <rect width="1100" height="650" fill="#0b1220"/>
  <style>
    .title{font:700 28px sans-serif;fill:#f8fafc}.sub{font:15px sans-serif;fill:#94a3b8}
    .label{font:16px sans-serif;fill:#e2e8f0}.value{font:700 15px monospace;fill:#f8fafc}
    .axis{stroke:#334155;stroke-width:1}.note{font:14px sans-serif;fill:#fbbf24}
  </style>
  <text x="55" y="55" class="title">DMC central temporal compute benchmark</text>
  <text x="55" y="82" class="sub">RTX 5080 · batch 6 tracks · 80 rows × 109D · 200 synchronized iterations · compute only</text>

  <text x="55" y="130" class="label">Forward latency p95 (lower is better)</text>
  <line x1="275" y1="150" x2="875" y2="150" class="axis"/>
  <text x="55" y="190" class="label">Causal TCN</text><rect x="275" y="170" width="309" height="28" rx="5" fill="#38bdf8"/><text x="596" y="190" class="value">0.531 ms</text>
  <text x="55" y="240" class="label">GRU</text><rect x="275" y="220" width="372" height="28" rx="5" fill="#22c55e"/><text x="659" y="240" class="value">0.638 ms</text>
  <text x="55" y="290" class="label">BiLSTM</text><rect x="275" y="270" width="406" height="28" rx="5" fill="#a78bfa"/><text x="693" y="290" class="value">0.697 ms</text>
  <text x="55" y="340" class="label">Transformer</text><rect x="275" y="320" width="600" height="28" rx="5" fill="#fb7185"/><text x="887" y="340" class="value">1.030 ms</text>

  <text x="55" y="405" class="label">Parameter count</text>
  <line x1="275" y1="425" x2="875" y2="425" class="axis"/>
  <text x="55" y="465" class="label">Causal TCN</text><rect x="275" y="445" width="53" height="25" rx="4" fill="#38bdf8"/><text x="340" y="464" class="value">56,449</text>
  <text x="55" y="507" class="label">GRU</text><rect x="275" y="487" width="179" height="25" rx="4" fill="#22c55e"/><text x="466" y="506" class="value">190,977</text>
  <text x="55" y="549" class="label">BiLSTM</text><rect x="275" y="529" width="600" height="25" rx="4" fill="#a78bfa"/><text x="887" y="548" class="value">640,257</text>
  <text x="55" y="591" class="label">Transformer</text><rect x="275" y="571" width="571" height="25" rx="4" fill="#fb7185"/><text x="858" y="590" class="value">609,281</text>

  <text x="55" y="630" class="note">Not an accuracy result. End-to-end throughput will be dominated by decode, Pose and tracking.</text>
</svg>
